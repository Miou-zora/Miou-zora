<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Miouzora, Alexandre Franquet. YoRHa personal data. Class: teacher at Epitech. Core: C++ and C. Now: building Wagoon. Off duty: Osu! and macro photography. Languages: C++, C, Python. Tools: Unity, Docker, xmake. Field: game engines, renderers, game protocols. 8709 commits since 30 September 2021.">
  <style>
    .f { font-family: helvetica, "Helvetica Neue", Arial, sans-serif; font-weight: 300; }
